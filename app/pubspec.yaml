name: sonoleve
description: "SonoLeve - aplicativo de higiene do sono e apoio ao relaxamento."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2

  # Próxima etapa (integração real) — manter comentado enquanto o app usa dados mockados:
  # firebase_core:
  # firebase_auth:
  # cloud_firestore:
  # firebase_storage:
  # shared_preferences:
  # path_provider:
  # just_audio:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
